<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Panel Admin - ISTA-GC</title>
  <style>
    body{font-family:Arial; padding:20px; max-width:600px; margin:auto}
    input,button{padding:10px; margin:5px; width:100%}
    #admin{display:none}
  </style>
</head>
<body>
  <h1>Panel Admin ISTA-GC</h1>

  <div id="login">
    <input id="email" type="email" placeholder="Email Admin">
    <input id="password" type="password" placeholder="Mot de passe">
    <button onclick="login()">Se connecter</button>
  </div>

  <div id="admin">
    <h2>Ajouter un cours</h2>
    <input id="nomCours" placeholder="Nom du cours">
    <input id="salle" placeholder="Salle">
    <button onclick="ajouterCours()">Ajouter</button>
    <button onclick="logout()">Se déconnecter</button>
  </div>

<script type="module">
  // ⚠️ COLLE ICI LA MÊME firebaseConfig QUE DANS salle-cours.html
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
  import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
  import { getFirestore, collection, addDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

  const firebaseConfig = {
    // COPIE COLLE TA CONFIG ICI
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  onAuthStateChanged(auth, user => {
    if(user){
      document.getElementById('login').style.display='none';
      document.getElementById('admin').style.display='block';
    }
  });

  window.login = () => {
    signInWithEmailAndPassword(auth, email.value, password.value)
    .catch(err => alert(err.message))
  }

  window.logout = () => signOut(auth)

  window.ajouterCours = async () => {
    await addDoc(collection(db, "cours"), {
      nom: nomCours.value,
      salle: salle.value,
      date: new Date()
    });
    alert("Cours ajouté !");
  }
</script>
</body>
</html>
