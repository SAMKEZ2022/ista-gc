<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Espace Prof - ISTA-GC</title>
    <style>
        body{font-family:Arial;margin:0;padding:20px;background:#f0f2f5}
       .header{background:#dc3545;color:white;padding:15px;border-radius:5px;display:flex;justify-content:space-between}
       .card{background:white;padding:20px;margin-top:20px;border-radius:5px}
    </style>
</head>
<body>
    <div class="header">
        <h3>Espace Professeur</h3>
        <button onclick="logout()">Déconnexion</button>
    </div>
    <div class="card">
        <h4>Devoirs reçus</h4>
        <p>Connecte-toi pour voir les devoirs des étudiants dans Firebase Storage > dossier devoirs</p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        const firebaseConfig = {apiKey: "METS_TA_VRAIE_CLE_ICI", authDomain: "ista-gc.firebaseapp.com", projectId: "ista-gc", storageBucket: "ista-gc.appspot.com", appId: "1:XXXX:web:XXXX"};
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        onAuthStateChanged(auth, (user) => { 
            if (!user || user.email!= 'prof.test@ista.gc.tg') window.location.href = 'login-prof.html'; 
        });
        window.logout = () => signOut(auth).then(() => window.location.href = 'login-prof.html');
    </script>
</body>
</html>
