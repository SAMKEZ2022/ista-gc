<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8"><title>Panel Prof</title>
<style>body{font-family:'Segoe UI'; padding:20px; background:#F0F4F8}
.box{max-width:600px; margin:auto; background:white; padding:20px; border-radius:12px}
input{width:100%; padding:12px; margin:10px 0; border:1px solid #ccc}
.btn{background:#004AAD; color:white; padding:14px; border:none; width:100%; cursor:pointer; border-radius:8px}</style>
</head>
<body>
<div class="box">
  <h2>Panel Professeur ISTA-GC</h2>
  <div id="login">
    <input id="email" type="email" placeholder="Email Prof">
    <input id="pass" type="password" placeholder="Mot de passe">
    <button class="btn" onclick="login()">Se connecter</button>
  </div>
  <div id="admin" style="display:none">
    <p>Connecté: <b id="profEmail"></b> <button onclick="logout()">Déconnexion</button></p>
    <h3>Ajouter un cours</h3>
    <input id="nomCours" placeholder="Nom du cours">
    <input id="salle" placeholder="Salle ou Lien Zoom">
    <input id="heure" type="datetime-local">
    <input id="lien" placeholder="Lien Google Meet">
    <button class="btn" onclick="ajouterCours()">Lancer le cours</button>
    <hr><h3>Mes cours</h3><ul id="liste"></ul>
  </div>
</div>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
import { getFirestore, collection, addDoc, query, where, onSnapshot, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
const app = initializeApp({apiKey: "AIzaSyCv3W6M3RmbipblwJ65Q0uw99a2H3tStU0", authDomain: "ista-gc.firebaseapp.com", projectId: "ista-gc"});
const auth = getAuth(app); const db = getFirestore(app); let userId = null;

function login(){ signInWithEmailAndPassword(auth, email.value, pass.value).catch(e=>alert(e.message)) }
function logout(){ signOut(auth) }

onAuthStateChanged(auth, user=>{
  if(user){
    userId = user.uid;
    document.getElementById('login').style.display='none';
    document.getElementById('admin').style.display='block';
    document.getElementById('profEmail').innerText=user.email;
    // Affiche seulement les cours de ce prof
    onSnapshot(query(collection(db,"cours"), where("profId","==",userId)), snap=>{
      liste.innerHTML=''; snap.forEach(d=>{
        const c=d.data(); liste.innerHTML+=`<li>${c.nom} - ${c.heure} <a href="salle.html?id=${d.id}" target="_blank">Lien Etudiant</a></li>`
      })
    })
  } else {
    document.getElementById('login').style.display='block';
    document.getElementById('admin').style.display='none';
  }
});

async function ajouterCours(){
  await addDoc(collection(db,"cours"),{
    nom:nomCours.value, salle:salle.value, heure:heure.value, lien:lien.value,
    profId:userId, // Important: on lie le cours au prof
    created:serverTimestamp()
  });
  alert("Cours lancé!"); nomCours.value=''; lien.value='';
}
</script>
</body>
</html>
