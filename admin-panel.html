<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>ISTA-GC | Panel Admin</title>
  <style>
    body{margin:0; font-family:'Segoe UI', Arial; background:#f5f1eb} /* fond café clair */
    
    /* HEADER COULEUR CAFÉ */
    header{
      background:#6B4F3D; /* Café foncé */
      color:white; 
      padding:15px 30px; 
      display:flex; 
      align-items:center;
      gap:15px;
      box-shadow:0 2px 5px rgba(0,0,0,0.2)
    }
    header img{height:45px}
    header h1{font-size:20px; margin:0}

    .box{max-width:500px; margin:50px auto; background:white; padding:30px; border-radius:8px; box-shadow:0 2px 15px rgba(107,79,61,0.2)}
    input{padding:12px; margin:8px 0; width:100%; box-sizing:border-box; border:1px solid #D2B48C; border-radius:4px}
    input:focus{outline:none; border-color:#6B4F3D}
    
    /* BOUTON COULEUR CAFÉ */
    button{
      padding:12px; 
      width:100%; 
      background:#8B6F47; /* Café */
      color:white; 
      border:none; 
      cursor:pointer; 
      border-radius:4px; 
      font-size:16px;
      font-weight:bold
    }
    button:hover{background:#6B4F3D}

    #admin{display:none}
    h2{text-align:center; color:#6B4F3D}
    .logout{background:#A0522D !important; margin-top:15px}
  </style>
</head>
<body>
  <header>
    <!-- REMPLACE PAR TON LOGO ISTA -->
    <img src="https://via.placeholder.com/45x45.png?text=ISTA" alt="Logo ISTA">
    <h1>ISTA-GC | Panel Admin</h1>
  </header>

  <div class="box">
    <h2>Connexion Admin</h2>
    <div id="login">
      <input id="email" type="email" placeholder="Email Admin">
      <input id="password" type="password" placeholder="Mot de passe">
      <button onclick="login()">Se connecter</button>
    </div>

    <div id="admin">
      <h2>Ajouter un cours</h2>
      <input id="nomCours" placeholder="Nom du cours">
      <input id="salle" placeholder="Salle">
      <input id="heure" placeholder="Heure ex: 08h-10h">
      <button onclick="ajouterCours()">Ajouter le cours</button>
      <button onclick="logout()" class="logout">Se déconnecter</button>
    </div>
  </div>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
  import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
  import { getFirestore, collection, addDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

  // COLLE ICI LA MÊME CONFIG QUE salle-cours.html
  const firebaseConfig = { /* ... */ };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  onAuthStateChanged(auth, user => {
    if(user){ document.getElementById('login').style.display='none'; document.getElementById('admin').style.display='block'; }
  });

  window.login = () => signInWithEmailAndPassword(auth, email.value, password.value).catch(err => alert("Erreur: " + err.message))
  window.logout = () => signOut(auth).then(()=>location.reload())
  window.ajouterCours = async () => {
    if(!nomCours.value) return alert("Remplis le nom du cours");
    await addDoc(collection(db, "cours"), {nom: nomCours.value, salle: salle.value, heure: heure.value, createdAt: new Date()});
    alert("Cours ajouté !");
    nomCours.value = ""; salle.value = ""; heure.value = "";
  }
</script>
</body>
</html>
