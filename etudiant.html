<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISTA-GC | Espace Etudiant</title>
    <style>
        :root { --primary: #003366; --accent: #28a745; --danger: #dc3545; --live: #ff0000; --bg: #f4f7f9; --text: #333; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; }
        header { background: var(--primary); color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .container { max-width: 1200px; margin: 20px auto; padding: 20px; }
        h1, h3 { color: var(--primary); }
        h3 { border-bottom: 2px solid var(--primary); padding-bottom: 10px; margin-top: 30px; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .card-live { border-left: 5px solid var(--live); background: #fff0f0; }
        .btn-live { background: var(--live); font-size: 18px; padding: 15px 30px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        button { background: var(--accent); color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-logout { background: var(--danger); }
        input, select { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        form { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <header>
        <h1>🎓 Espace Étudiant</h1>
        <button class="btn-logout">Déconnexion</button>
    </header>
    <div class="container">
        
        <h3>🔴 Cours en Live Maintenant</h3>
        <div id="listeCours"></div>

        <h3>📚 Supports de Cours</h3>
        <div id="listeSupportsEtudiant"></div>

        <h3>📝 Mes Devoirs</h3>
        <div id="listeDevoirsEtudiant"></div>

        <h3>📤 Déposer une Copie</h3>
        <form id="formDepot">
            <select id="depotDevoir" required></select>
            <input type="file" id="depotFile" required>
            <button type="submit">Déposer</button>
        </form>

    </div>
    <script src="./script.js"></script>
</body>
</html>
