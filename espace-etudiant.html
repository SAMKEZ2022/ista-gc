<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ISTR - Espace Étudiant</title>
  <style>
    :root {
      --bleu-istr: #0056b3;
      --vert-istr: #00a859;
      --gris-bg: #f4f6f9;
    }
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--gris-bg); margin: 0; padding: 0; }
    
    .header {
      background: linear-gradient(135deg, var(--bleu-istr) 0%, var(--vert-istr) 100%);
      color: white;
      padding: 20px 30px;
      display: flex;
      align-items: center;
      gap: 25px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }
    .header img {
      height: 85px;
      background: transparent;
      border-radius: 0;
      padding: 0;
      object-fit: contain;
    }
    .header-text h1 { margin: 0; font-size: 22px; font-weight: 700; }
    .header-text p { margin: 5px 0 0; font-size: 15px; opacity: 0.95; }

    .container { max-width: 850px; margin: 30px auto; background: white; padding: 35px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    h2 { color: var(--bleu-istr); }
    input { width: 100%; padding: 14px; margin: 12px 0; border: 2px solid #ddd; border-radius: 8px; font-size: 15px; }
    input:focus { border-color: var(--bleu-istr); outline: none; }
    button { width: 100%; padding: 15px; background: var(--bleu-istr); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
    button:hover { background: #004494; transform: translateY(-2px); }
    .note { background: #f0f9ff; padding: 20px; margin: 15px 0; border-left: 6px solid var(--vert-istr); border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
    .note b { color: var(--bleu-istr); font-size: 17px; }
    .note .semestre { background: var(--vert-istr); color: white; padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; }
    .error { color: #dc3545; text-align: center; margin-top: 10px; font-weight: bold; }
    .hidden { display: none; }
    .header-notes { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--gris-bg); padding-bottom: 15px; margin-bottom: 25px; }
    .btn-logout { background: #dc3545; width: auto; padding: 10px 20px; font-size: 14px; }
    .btn-logout:hover { background: #c82333; }
    .welcome { color: var(--bleu-istr); margin-bottom: 20px; }
    @media (max-width: 600px) {
      .header { flex-direction: column; text-align: center; gap: 10px; }
      .header img { height: 70px; }
      .container { margin: 15px; padding: 20px; }
    }
  </style>
</head>
