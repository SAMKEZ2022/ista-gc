<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Espace Étudiant - ISTA-GC</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; }
    header { background: #1a73e8; color: white; padding: 20px; text-align: center; }
    .container { max-width: 900px; margin: 20px auto; padding: 20px; }
    .cours-card { background: white; padding: 20px; margin-bottom: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .cours-card h3 { margin: 0 0 10px 0; color: #1a73e8; }
    .matiere { background: #e8f0fe; color: #1a73e8; padding: 5px 10px; border-radius: 15px; font-size: 12px; display: inline-block; }
    .btn-download { display: inline-block; margin-top: 10px; padding: 10px 15px; background: #34a853; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; }
    .btn-download:hover { background: #2c8a47; }
    .date { color: #777; font-size: 12px; float: right; }
    #logout { float: right; background: red; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; }
  </style>
</head>
<body>

  <header>
    <h1>📚 Espace Étudiant ISTA-GC</h1>
    <button id="logout">Déconnexion</button>
  </header>

  <div class="container">
    <h2>Liste des Cours Disponibles</h2>
    <div id="liste-cours">Chargement des cours...</div>
  </div>

  <script type="module">
    // 1. IMPORT FIREBASE
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    // 2. COLLE TA CONFIG FIREBASE ICI
    const firebaseConfig = {
      apiKey: "TA_CLE_API",
      authDomain: "ista-gc.firebaseapp.com",
      projectId: "ista-gc",
      storageBucket: "ista-gc.appspot.com",
      messagingSenderId: "TON_ID",
      appId: "TON_APP_ID"
    };

    // 3. INITIALISATION
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth();

    // 4. SECURITE: Redirige si pas connecté
    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = "login.html"; 
      } else {
        chargerCours(); // Charge les cours si connecté
      }
    });

    // 5. DECONNEXION
    document.getElementById('logout').addEventListener('click', () => {
      signOut(auth).then(() => {
        window.location.href = "login.html";
      });
    });

    // 6. CHARGER LES COURS DEPUIS FIRESTORE
    async function chargerCours() {
      const listeDiv = document.getElementById('liste-cours');
      const q = query(collection(db, "cours"), orderBy("date", "desc"));
      
      try {
        const querySnapshot = await getDocs(q);
        if(querySnapshot.empty){
          listeDiv.innerHTML = "<p>Aucun cours publié pour le moment.</p>";
          return;
        }

        let html = "";
        querySnapshot.forEach((doc) => {
          const cours = doc.data();
          const date = cours.date ? cours.date.toDate().toLocaleDateString('fr-FR') : 'Date inconnue';
          
          html += `
            <div class="cours-card">
              <span class="date">${date}</span>
              <span class="matiere">${cours.matiere}</span>
              <h3>${cours.titre}</h3>
              <a href="${cours.lienPDF}" target="_blank" class="btn-download">📄 Télécharger le PDF</a>
            </div>
          `;
        });
        listeDiv.innerHTML = html;

      } catch (error) {
        listeDiv.innerHTML = "<p style='color:red;'>Erreur de chargement: " + error.message + "</p>";
      }
    }
  </script>

</body>
</html>
