<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Espace Étudiant - ISTAGC</title>
  <style>
    body{margin:0;font-family:'Segoe UI',Arial;background:#f5f7fa}
    header{background:linear-gradient(135deg,#007BFF,#00C853);color:white;padding:25px;text-align:center}
    header h1{font-size:20px;margin:0}
    .container{background:white;margin:20px auto;padding:30px;border-radius:16px;max-width:800px;box-shadow:0 4px 20px rgba(0,0,0,0.1)}
    .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
    .deco{background:#DC3545;color:white;border:none;padding:10px 20px;border-radius:8px;cursor:pointer;font-weight:bold}
    .note-card{background:#f0f4ff;padding:15px;border-left:4px solid #007BFF;margin:10px 0;border-radius:8px}
    .note-matiere{font-weight:bold;color:#007BFF}
  </style>
</head>
<body>
  <header>
    <h1>INSTITUT SUPÉRIEUR DE TECHNOLOGIE AGROPASTORALE</h1>
    <p>ISTAGC - Plateforme Académique Étudiante</p>
  </header>

  <div class="container">
    <div class="top">
      <h2 id="welcome">Bienvenue</h2>
      <button class="deco" onclick="logout()">Déconnexion</button>
    </div>
    
    <h3>Mes Notes Académiques</h3>
    <div id="notes">Chargement...</div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // COLLE TA MEME CONFIG ICI
    const firebaseConfig = {
      apiKey: "TA_CLE",
      authDomain: "TON_PROJET.firebaseapp.com",
      projectId: "TON_PROJET",
      storageBucket: "TON_PROJET.appspot.com",
      messagingSenderId: "XXX",
      appId: "XXX"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        document.getElementById('welcome').innerText = `Bienvenue, ${user.email}`;
        await chargerNotes(user.email);
      } else {
        window.location.href = "login-etudiant.html";
      }
    });

    async function chargerNotes(emailEtudiant) {
      const notesDiv = document.getElementById('notes');
      try {
        const q = query(collection(db, "notes"), where("email", "==", emailEtudiant));
        const querySnapshot = await getDocs(q);
        
        if (querySnapshot.empty) {
          notesDiv.innerHTML = "<p>Aucune note disponible pour le moment.</p>";
          return;
        }

        let html = "";
        querySnapshot.forEach((doc) => {
          const data = doc.data();
          html += `
            <div class="note-card">
              <div class="note-matiere">${data.matiere} - ${data.code}</div>
              <div>Note: <b>${data.note}/20</b> | Semestre: ${data.semestre}</div>
            </div>
          `;
        });
        notesDiv.innerHTML = html;

      } catch (error) {
        notesDiv.innerHTML = "Erreur de chargement des notes";
        console.error(error);
      }
    }

    function logout(){ signOut(auth); }
    window.logout = logout;
  </script>
</body>
</html>
