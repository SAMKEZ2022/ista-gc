<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Espace Étudiant - ISTA-GC</title>
  <style>
    body { font-family: Arial; background: #f4f4f4; margin: 0; }
    header { background: #1a73e8; color: white; padding: 15px 20px; display: flex; justify-content: space-between; }
    .container { max-width: 900px; margin: 20px auto; padding: 20px; }
    .cours-card { background: white; padding: 20px; margin-bottom: 15px; border-radius: 8px; }
    .btn-download { padding: 10px 15px; background: #34a853; color: white; text-decoration: none; border-radius: 5px; }
    #logout { width: auto; background: red; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; }
  </style>
</head>
<body>
  <header>
    <h2>📚 Espace Étudiant</h2>
    <button id="logout">Déconnexion</button>
  </header>
  <div class="container">
    <h3>Liste des Cours</h3>
    <div id="liste-cours">Chargement...</div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCv3W6M3RmbipblwJ65Q0uw99a2H3tStU0",
      authDomain: "ista-gc.firebaseapp.com",
      projectId: "ista-gc",
      storageBucket: "ista-gc.firebasestorage.app",
      messagingSenderId: "75501350048",
      appId: "1:75501350048:web:8def71328c58dd6b7d6dc5",
      measurementId: "G-B2Y89V3X35"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    onAuthStateChanged(auth, (user) => {
      if (user) { chargerCours(); } else { window.location.href = "login.html"; }
    });

    document.getElementById('logout').addEventListener('click', () => {
      signOut(auth).then(() => window.location.href = "login.html");
    });

    async function chargerCours() {
      const q = query(collection(db, "cours"), orderBy("date", "desc"));
      const snap = await getDocs(q);
      let html = snap.empty ? "<p>Aucun cours.</p>" : "";
      snap.forEach(doc => {
        const c = doc.data();
        html += `<div class="cours-card"><h3>${c.titre}</h3><p>${c.matiere}</p><a href="${c.lienPDF}" target="_blank" class="btn-download">Télécharger</a></div>`;
      });
      document.getElementById('liste-cours').innerHTML = html;
    }
  </script>
</body>
</html>
