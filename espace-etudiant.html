<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Espace Étudiant - ISTA GC</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
  <div class="p-8">
    <h1 class="text-3xl font-bold">Bienvenue sur l'Espace Étudiant ISTA</h1>
    <p class="mt-4">Ici tu verras tes notes, emplois du temps, ressources...</p>
    <button onclick="logout()" class="mt-6 bg-red-600 text-white p-2 rounded">Se déconnecter</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCv3W6M3RmbipblwJ65Q0uw99a2H3tStU0",
      authDomain: "ista-gc.firebaseapp.com",
      projectId: "ista-gc",
      storageBucket: "ista-gc.firebasestorage.app",
      messagingSenderId: "75501350048",
      appId: "1:75501350048:web:8def71328c58dd6b7d6dc5",
      measurementId: "G-B2Y89V3X35"
    };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    onAuthStateChanged(auth, (user) => {
      if (!user) window.location.href = "login.html";
    });

    window.logout = () => signOut(auth).then(() => window.location.href = "login.html");
  </script>
</body>
</html>
