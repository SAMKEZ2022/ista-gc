<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Connexion Étudiant - ISTAGC</title>
  <style>
    body{margin:0;font-family:'Segoe UI',Arial;background:linear-gradient(135deg,#007BFF,#00C853);height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center}
    header{color:white;text-align:center;margin-bottom:30px}
    header h1{font-size:22px}
    .box{background:white;padding:40px;border-radius:16px;width:400px;box-shadow:0 10px 40px rgba(0,0,0,0.2)}
    .box h2{text-align:center;color:#007BFF;margin-bottom:25px}
    input{width:100%;padding:14px;margin:12px 0;border:2px solid #e0e0e0;border-radius:10px;font-size:15px}
    button{width:100%;padding:14px;background:#007BFF;color:white;border:none;border-radius:10px;font-size:16px;font-weight:bold;cursor:pointer}
    button:hover{background:#0056b3}
    .error{color:#DC3545;text-align:center;margin-top:15px;font-weight:600}
  </style>
</head>
<body>
  <header>
    <h1>INSTITUT SUPÉRIEUR DE TECHNOLOGIE AGROPASTORALE</h1>
    <p>ISTAGC - Plateforme Académique Étudiante</p>
  </header>
  <div class="box">
    <h2>Connexion Étudiant</h2>
    <input type="email" id="email" placeholder="Email étudiant">
    <input type="password" id="password" placeholder="Mot de passe">
    <button onclick="login()">Se connecter</button>
    <p class="error" id="error"></p>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCv3W6M3RmbipblwJ65Q0uw99a2H3tStU0",
      authDomain: "ista-gc.firebaseapp.com",
      projectId: "ista-gc",
      storageBucket: "ista-gc.firebasestorage.app",
      messagingSenderId: "75501350048",
      appId: "1:75501350048:web:8def71328c58dd6b7d6dc5",
      measurementId: "G-B2Y89V3X35"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    async function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('error');
      errorEl.innerText = "";
      try {
        const userCredential = await signInWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;
        const userDoc = await getDoc(doc(db, "users", user.uid));
        if (!userDoc.exists()) { throw new Error("Compte non trouvé dans la base"); }
        const role = userDoc.data().role;
        if (role === "etudiant") { window.location.href = "espace-etudiant.html"; }
        else if (role === "prof") { window.location.href = "admin-panel.html"; }
        else { errorEl.innerText = "Role non défini"; await auth.signOut(); }
      } catch (error) { errorEl.innerText = error.message; }
    }
    window.login = login;
  </script>
</body>
</html>
