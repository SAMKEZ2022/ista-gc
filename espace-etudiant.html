<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>ISTAGC - Espace Étudiant</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f0f2f5; padding: 20px; }
    .container { max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 10px; }
    h1 { color: #0056b3; text-align: center; }
    input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; }
    button { width: 100%; padding: 12px; background: #0056b3; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; }
    .note { background: #e7f3ff; padding: 15px; margin: 10px 0; border-left: 5px solid #0056b3; }
    .error { color: red; text-align: center; }
    .hidden { display: none; }
  </style>
</head>
<body>
<div class="container">
  <h1>ISTAGC - Espace Étudiant</h1>
  <div id="login-box">
    <h3>Connexion</h3>
    <input type="email" id="email" placeholder="Email étudiant" value="etudiant1@ista.gc">
    <input type="password" id="password" placeholder="Mot de passe" value="Etudiant123">
    <button onclick="login()">Se connecter</button>
    <p id="error-msg" class="error"></p>
  </div>
  <div id="notes-box" class="hidden">
    <h3>Mes Notes</h3>
    <div id="notes-list">Chargement...</div>
  </div>
</div>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  const firebaseConfig = { apiKey: "AIzaSyCv3W6M3RmbipblwJ65Q0uw99a2H3tStU0", authDomain: "ista-gc.firebaseapp.com", projectId: "ista-gc", storageBucket: "ista-gc.firebasestorage.app", messagingSenderId: "75501350048", appId: "1:75501350048:web:8def71328c58dd6b7d6dc5", measurementId: "G-B2Y89V3X35" };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  onAuthStateChanged(auth, (user) => { if (user) { document.getElementById('login-box').classList.add('hidden'); document.getElementById('notes-box').classList.remove('hidden'); loadNotes(user.email); } });
  window.login = () => { const email = document.getElementById('email').value; const password = document.getElementById('password').value; signInWithEmailAndPassword(auth, email, password).catch((error) => { document.getElementById('error-msg').innerText = "Erreur: " + error.message; }); }
  async function loadNotes(studentEmail) { const notesList = document.getElementById('notes-list'); const q = query(collection(db, "notes"), where("studentEmail", "==", studentEmail)); const querySnapshot = await getDocs(q); notesList.innerHTML = ""; querySnapshot.forEach((doc) => { const note = doc.data(); notesList.innerHTML += `<div class="note"><b>${note.courseName}</b> : ${note.grade}/20</div>`; }); }
</script>
</body>
</html>
