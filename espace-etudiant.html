<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Espace Étudiant - ISTA-GC</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <h2>🎓 Espace Étudiant</h2>
  <button onclick="logout()" class="btn btn-secondary">Déconnexion</button>

  <div class="tabs">
    <button class="tab-btn active" onclick="showTab('devoirs')">📚 Devoirs</button>
    <button class="tab-btn" onclick="showTab('live')">📡 Cours en Live</button>
  </div>

  <div id="devoirs" class="tab-content active">
    <h3>Mes Devoirs</h3>
    <div id="listeDevoirsEtudiant"></div>
  </div>

  <div id="live" class="tab-content">
    <h3>Cours en Live</h3>
    <div id="listeLivesEtudiant"></div>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
