<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Espace Étudiant - ISTA GC</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
  <div class="p-8 max-w-4xl mx-auto">
    <h1 class="text-3xl font-bold">Bienvenue <span id="user-email" class="text-blue-600"></span></h1>
    
    <div class="mt-8 bg-white p-6 rounded shadow">
      <h2 class="text-xl font-bold mb-4">📊 Mes Notes</h2>
      <div id="notes-list">Chargement...</div>
    </div>

    <button onclick="logout()" class="mt-8 bg-red-600 text-white p-2 rounded">Se déconnecter</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCv3W6M3RmbipblwJ65Q0uw99a2H3tStU0",
      authDomain: "ista-gc.firebaseapp.com",
      projectId: "ista-gc",
      storageBucket: "ista-gc.firebasestorage.app",
      messagingSenderId: "75501350048",
      appId: "1:75501350048:web:8def71328c58dd6b7d6dc5"
    };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        document.getElementById('user-email').innerText = user.email;
        const q = query(collection(db, "tape notes"), where("email", "==", user.email));
        const querySnapshot = await getDocs(q);
        let html = "";
        querySnapshot.forEach((doc) => {
          const data = doc.data();
          html += `<div class="border p-3 mb-2 rounded"><b>${data.matiere}</b> : ${data.note}/20 - ${data.semestre}</div>`;
        });
        document.getElementById('notes-list').innerHTML = html || "Aucune note pour le moment";
      } else {
        window.location.href = "login.html";
      }
    });

    window.logout = () => signOut(auth).then(() => window.location.href = "login.html");
  </script>
</body>
</html>
