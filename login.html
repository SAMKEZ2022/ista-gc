<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - ISTA-GC</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🎓 ISTA-GC</h1>
        <h2>Connexion Plateforme</h2>
        
        <form id="loginForm">
            <label>Email</label>
            <input type="email" id="email" placeholder="prof.math@ista-gc.com" required>
            
            <label>Mot de passe</label>
            <input type="password" id="password" placeholder="1234" required>
            
            <button type="submit">Se connecter</button>
        </form>
        
        <p id="error" class="error"></p>
        
        <div class="info">
            <p><b>Prof:</b> prof.math@ista-gc.com / 1234</p>
            <p><b>Étudiant:</b> etudiant.gc@ista-gc.com / 1234</p>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
