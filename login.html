<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - ISTA-GC</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="body-login">
    <div class="container login-box">
        <h1>🎓 ISTA-GC</h1>
        <p class="subtitle">Plateforme de Cours en Ligne</p>
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="votre.email@ista-gc.com" required>
            </div>
            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" placeholder="••••••" required>
            </div>
            <button type="submit" class="btn-primary">Se connecter</button>
        </form>
        <p id="error"></p>
        <div class="info-box">
            <p><b>Prof:</b> prof.math@ista-gc.com | 1234</p>
            <p><b>Étudiant:</b> etudiant.gc@ista-gc.com | 1234</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
