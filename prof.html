<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Espace Prof - ISTA-GC</title>
  <style>
    body { font-family: 'Segoe UI', Arial; background: #f4f4f4; margin: 0; }
    header { background: #1a73e8; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
    #logout { background: red; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }
   .container { max-width: 1000px; margin: 30px auto; padding: 20px; }
   .tabs { display: flex; margin-bottom: 20px; border-radius: 8px; overflow: hidden; background: #eee; }
   .tab { flex: 1; padding: 14px; background: #ddd; border: none; cursor: pointer; font-weight: bold; font-size: 16px; }
   .tab.active { background: #1a73e8; color: white; }
   .card { background: white; padding: 20px; margin-bottom: 15px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    input, textarea { width: 100%; padding: 10px; margin: 8px 0; border-radius: 6px; border: 1px solid #ddd; box-sizing: border-box; }
   .btn { padding: 12px 25px; background: #1a73e8; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
   .btn-download { display: inline-block; padding: 10px 20px; background: #34a853; color: white; text-decoration: none; border-radius: 6px; font-weight: bold; }
  </style>
</head>
<body>
  <header>
    <h2>👨‍🏫 Espace Professeur</h2>
    <button id="logout">Déconnexion</button>
  </header>
  
  <div class="container">
    <div class="tabs">
      <button class="tab active" onclick="showTab('publier')">Publier</button>
      <button class="tab" onclick="showTab('copies')">Voir les Copies</button>
    </div>

    <div id="publier">
      <div class="card">
        <h3>Publier un Cours PDF</h3>
        <input id="titreCours" placeholder="Titre du cours">
        <input id="matiereCours" placeholder="Matière">
        <input id="lienCours" placeholder="Lien Google Drive du PDF">
        <button class="btn" onclick="publierCours()">Publier le Cours</button>
      </div>
      <div class="card">
        <h3>Publier un Devoir</h3>
        <input id="titreDevoir" placeholder="Titre du devoir">
        <input id="matiereDevoir" placeholder="Matière">
        <textarea id="descDevoir" placeholder="Description/Consigne"></textarea>
        <input id="dateLimite" type="date">
        <input id="lienDevoir" placeholder="Lien Google Drive du sujet PDF - Optionnel">
        <button class="btn" onclick="publierDevoir()">Publier le Devoir</button>
      </div>
    </div>

    <div id="copies" style="display:none;">
      <h3>Copies des Étudiants</h3>
      <div id="listeCopies">Chargement...</div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {apiKey: "AIzaSyCv3W6M3RmbipblwJ65Q0uw99a2H3tStU0",authDomain: "ista-gc.firebaseapp.com",projectId: "ista-gc",storageBucket: "ista-gc.firebasestorage.app",messagingSenderId: "75501350048",appId: "1:75501350048:web:8def71328c58dd6b7d6dc5",measurementId: "G-B2Y89V3X35"};
    
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    onAuthStateChanged(auth, (user) => { if (!user) window.location.href = "login.html"; });
    document.getElementById('logout').addEventListener('click', () => signOut(auth).then(() => window.location.href = "login.html"));
    
    window.showTab = (tab) => { 
      document.getElementById('publier').style.display = tab === 'publier'? 'block' : 'none'; 
      document.getElementById('copies').style.display = tab === 'copies'? 'block' : 'none'; 
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');
      if(tab === 'copies') chargerCopies();
    }

    function convertirLienDrive(lien) { 
      if(lien && lien.includes("drive.google.com/file/d/")){ 
        const fileId = lien.split("/d/")[1].split("/")[0]; 
        return `https://drive.google.com/uc?export=download&id=${fileId}`; 
      } 
      return lien; 
    }

    window.publierCours = async () => {
      const t = titreCours.value, m = matiereCours.value, l = convertirLienDrive(lienCours.value);
      if(!t ||!m ||!l){ alert("Remplis tout"); return; }
      await addDoc(collection(db, "cours"), { titre: t, matiere: m, lien: l, date: serverTimestamp() });
      alert("✅ Cours publié!"); titreCours.value = ""; matiereCours.value = ""; lienCours.value = "";
    }
    
    window.publierDevoir = async () => {
      const t = titreDevoir.value, m = matiereDevoir.value, d = descDevoir.value, dl = dateLimite.value, l = convertirLienDrive(lienDevoir.value);
      if(!t ||!m ||!d ||!dl){ alert("Remplis tout sauf le lien"); return; }
      await addDoc(collection(db, "devoirs"), { titre: t, matiere: m, description: d, dateLimite: dl, lienPDF: l, date: serverTimestamp() });
      alert("✅ Devoir publié!"); titreDevoir.value = ""; matiereDevoir.value = ""; descDevoir.value = ""; dateLimite.value = ""; lienDevoir.value = "";
    }

    async function chargerCopies() {
      const q = query(collection(db, "copies"), orderBy("dateDepot", "desc"));
      const snap = await getDocs(q);
      let html = snap.empty? "<p>Aucune copie déposée pour le moment.</p>" : "";
      snap.forEach(doc => {
        const c = doc.data();
        html += `<div class="card">
          <h4>${c.titreDevoir}</h4>
          <p><b>Étudiant:</b> ${c.emailEtudiant}</p>
          <p><b>Date de dépôt:</b> ${c.dateDepot? new Date(c.dateDepot.seconds * 1000).toLocaleString('fr-FR') : '...'}</p>
          <a href="${c.lienCopie}" target="_blank" class="btn-download">📥 Ouvrir la copie Drive</a>
        </div>`;
      });
      document.getElementById('listeCopies').innerHTML = html;
    }
  </script>
</body>
</html>
