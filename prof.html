<section><h2>📁 Envoyer un Support de Cours</h2>
    <form id="formAddSupport" class="card">
        <select id="supportCours" required></select>
        <input type="text" id="supportNom" placeholder="Nom du fichier: Chapitre 1.pdf" required>
        <input type="file" id="supportFile" accept=".pdf,.docx,.pptx" required>
        <button type="submit" class="btn-primary">Envoyer</button>
    </form>
    <div id="listeSupportsProf"></div>
</section>
