<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Espace Prof - ISTA-GC</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <h2>👨‍🏫 Espace Professeur</h2>
  <button onclick="logout()" class="btn btn-secondary">Déconnexion</button>

  <div class="tabs">
    <button class="tab-btn active" onclick="showTab('publier')">📝 Publier Devoir</button>
    <button class="tab-btn" onclick="showTab('copies')">📂 Voir les Copies</button>
    <button class="tab-btn" onclick="showTab('live')">📡 Cours en Live</button>
  </div>

  <div id="publier" class="tab-content active">
    <h3>Publier un Devoir</h3>
    <input type="text" id="titreDevoir" placeholder="Titre du devoir">
    <textarea id="descDevoir" placeholder="Description"></textarea>
    <input type="datetime-local" id="dateDevoir">
    <input type="text" id="lienSujet" placeholder="Lien Google Drive du sujet - Lecture seule">
    <button onclick="publierDevoir()">Publier</button>
    <div id="listeDevoirsProf"></div>
  </div>

  <div id="copies" class="tab-content">
    <h3>Copies Déposées</h3>
    <div id="listeCopies"></div>
  </div>

  <div id="live" class="tab-content">
    <h3>Créer un Cours en Live</h3>
    <input type="text" id="liveTitre" placeholder="Titre du cours: Ex: RDM Chapitre 3">
    <input type="datetime-local" id="liveDate">
    <input type="text" id="liveLien" placeholder="Colle le lien Google Meet ici">
    <button onclick="creerLive()">📡 Programmer / Lancer le Live</button>
    <hr>
    <h4>Lives Programmés</h4>
    <div id="listeLivesProf"></div>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
