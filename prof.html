<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Espace Prof - ISTA-GC</title>
  <style>
    body { font-family: Arial; background: #f4f4f4; margin: 0; }
    header { background: #1a73e8; color: white; padding: 15px 20px; display: flex; justify-content: space-between; }
    .container { max-width: 600px; margin: 30px auto; background: white; padding: 30px; border-radius: 8px; }
    input, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 5px; border: 1px solid #ddd; box-sizing: border-box; }
    button { background: #34a853; color: white; border: none; font-weight: bold; cursor: pointer; }
    #logout { width: auto; background: red; }
  </style>
</head>
<body>
  <header>
    <h2>📚 Espace Prof</h2>
    <button id="logout">Déconnexion</button>
  </header>
  <div class="container">
    <h3>Publier un Nouveau Cours</h3>
    <input type="text" id="titre" placeholder="Titre du cours">
    <input type="text" id="matiere" placeholder="Matière">
    <input type="url" id="lienPDF" placeholder="Lien Google Drive du PDF">
    <button id="btnPublier">Publier le Cours</button>
    <div id="status"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCv3W6M3RmbipblwJ65Q0uw99a2H3tStU0",
      authDomain: "ista-gc.firebaseapp.com",
      projectId: "ista-gc",
      storageBucket: "ista-gc.firebasestorage.app",
      messagingSenderId: "75501350048",
      appId: "1:75501350048:web:8def71328c58dd6b7d6dc5",
      measurementId: "G-B2Y89V3X35"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    onAuthStateChanged(auth, (user) => {
      if (!user) { window.location.href = "login.html"; }
    });

    document.getElementById('logout').addEventListener('click', () => {
      signOut(auth).then(() => window.location.href = "login.html");
    });

    document.getElementById('btnPublier').addEventListener('click', async () => {
      const status = document.getElementById('status');
      try {
        await addDoc(collection(db, "cours"), {
          titre: document.getElementById('titre').value,
          matiere: document.getElementById('matiere').value,
          lienPDF: document.getElementById('lienPDF').value,
          date: serverTimestamp()
        });
        status.style.color = "green"; status.textContent = "✅ Cours publié!";
      } catch (error) {
        status.style.color = "red"; status.textContent = "❌ Erreur: " + error.message;
      }
    });
  </script>
</body>
</html>
