<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Espace Prof - ISTA-GC</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f4; padding: 20px; }
    .container { max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    h1 { color: #1a73e8; text-align: center; }
    input, select, button { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
    button { background: #1a73e8; color: white; font-weight: bold; cursor: pointer; border: none; }
    button:hover { background: #1558b0; }
    #message { text-align: center; font-weight: bold; margin-top: 15px; }
    small { color: #555; }
  </style>
</head>
<body>

  <div class="container">
    <h1>Publier un Cours</h1>
    <p>1. Mettez votre PDF sur Google Drive 2. Mettez en "Lecteur" 3. Collez le lien ici</p>
    
    <form id="form-cours">
      <input type="text" id="titre" placeholder="Titre du cours: Ex: Chapitre 1 - Matrice" required>
      
      <select id="matiere" required>
        <option value="">-- Choisir la matière --</option>
        <option value="Mathematiques">Mathématiques</option>
        <option value="Physique">Physique</option>
        <option value="Informatique">Informatique</option>
        <option value="Electronique">Electronique</option>
      </select>

      <input type="url" id="lien" placeholder="Collez le lien de partage Google Drive ici" required>
      <small><b>Important:</b> Sur Drive: Clic droit > Partager > Général > "Toute personne disposant du lien" > Rôle: Lecteur</small>

      <button type="submit">Publier le Cours</button>
    </form>
    <p id="message"></p>
  </div>

  <script type="module">
    // 1. IMPORT FIREBASE
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    // 2. COLLE TA CONFIG FIREBASE ICI
    const firebaseConfig = {
      apiKey: "TA_CLE_API",
      authDomain: "ista-gc.firebaseapp.com",
      projectId: "ista-gc",
      storageBucket: "ista-gc.appspot.com",
      messagingSenderId: "TON_ID",
      appId: "TON_APP_ID"
    };

    // 3. INITIALISATION
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth();

    const form = document.getElementById('form-cours');
    const msg = document.getElementById('message');

    // 4. SECURITE: Redirige si pas connecté
    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = "login.html"; 
      }
    });

    // 5. LOGIQUE D'ENVOI
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.textContent = "Publication en cours...";
      msg.style.color = "orange";

      const titre = document.getElementById('titre').value;
      const lien = document.getElementById('lien').value;
      const matiere = document.getElementById('matiere').value;

      try {
        // On enregistre SEULEMENT dans Firestore
        await addDoc(collection(db, "cours"), {
          titre: titre,
          lienPDF: lien, // Le lien Drive
          matiere: matiere,
          date: serverTimestamp(),
          profId: auth.currentUser.uid
        });
        
        msg.textContent = "✅ Cours publié avec succès!";
        msg.style.color = "green";
        form.reset();

      } catch (error) {
        msg.textContent = "❌ Erreur: " + error.message;
        msg.style.color = "red";
        console.error(error);
      }
    });
  </script>

</body>
</html>
