<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Espace Prof - ISTA-GC</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h1>👨‍🏫 Espace Professeur</h1>
    <button onclick="logout()">Déconnexion</button>
    
    <div class="tabs">
        <button class="tab-btn active" onclick="showTab('cours')">Ajouter Cours</button>
        <button class="tab-btn" onclick="showTab('devoirs')">Ajouter Devoir</button>
    </div>

    <div id="cours" class="tab-content">
        <h3>Nouveau Cours Live</h3>
        <input type="text" id="titreCours" placeholder="Titre du cours">
        <input type="text" id="dateCours" placeholder="Ex: Lundi 25 Août - 10h00">
        <input type="text" id="lienCours" placeholder="Lien Google Meet / Zoom">
        <button onclick="ajouterCours()">Publier le cours</button>
    </div>

    <div id="devoirs" class="tab-content" style="display:none">
        <h3>Nouveau Devoir</h3>
        <input type="text" id="titreDevoir" placeholder="Titre du devoir">
        <textarea id="descDevoir" placeholder="Description"></textarea>
        <button onclick="ajouterDevoir()">Publier le devoir</button>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
