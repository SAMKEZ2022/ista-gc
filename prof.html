<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Espace Prof - ISTA-GC</title>
  <style>
    body { font-family: 'Segoe UI', Arial; background: #f4f4f4; margin: 0; }
    header { background: #1a73e8; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
.container { max-width: 900px; margin: 30px auto; background: white; padding: 35px; border-radius: 12px; }
 .tabs { display: flex; margin-bottom: 20px; border-radius: 8px; overflow: hidden; }
 .tab { flex: 1; padding: 12px; background: #ddd; border: none; cursor: pointer; font-weight: bold; }
 .tab.active { background: #34a853; color: white; }
    input, textarea { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #ddd; }
    button { width: 100%; padding: 14px; background: #34a853; color: white; border: none; font-weight: bold; cursor: pointer; border-radius: 8px; }
    #logout { width: auto; background: red; padding: 10px 20px; }
 .copie-card { border: 1px solid #ddd; padding: 15px; margin: 10px 0; border-radius: 8px; }
  </style>
</head>
<body>
  <header><h2>📚 Espace Professeur</h2><button id="logout">Déconnexion</button></header>
  <div class="container">
    <div class="tabs">
      <button class="tab active" onclick="showTab('publier')">Publier</button>
      <button class="tab" onclick="showTab('copies')">Voir les Copies</button>
    </div>
    <div id="publier-form">
      <div class="tabs"><button class="tab active" onclick="showSousTab('cours')">Cours</button><button class="tab" onclick="showSousTab('devoir')">Devoir</button></div>
      <div id="cours-form"><input id="titreCours" placeholder="Titre du cours"><input id="matiereCours" placeholder="Matière"><input id="lienCours" placeholder="Lien Google Drive"><button onclick="publier('cours')">Publier le Cours</button></div>
      <div id="devoir-form" style="display:none;"><input id="titreDevoir" placeholder="Titre du devoir"><input id="matiereDevoir" placeholder="Matière"><input type="date" id="dateLimite"><textarea id="description" placeholder="Consignes"></textarea><input id="lienDevoir" placeholder="Lien Drive sujet - optionnel"><button onclick="publier('devoir')">Publier le Devoir</button></div>
    </div>
    <div id="copies-form" style="display:none;"><h3>Copies rendues</h3><div id="liste-copies">Chargement...</div></div>
    <div id="status"></div>
  </div>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    const firebaseConfig = {apiKey: "AIzaSyCv3W6M3RmbipblwJ65Q0uw99a2H3tStU0",authDomain: "ista-gc.firebaseapp.com",projectId: "ista-gc",storageBucket: "ista-gc.firebasestorage.app",messagingSenderId: "75501350048",appId: "1:75501350048:web:8def71328c58dd6b7d6dc5",measurementId: "G-B2Y89V3X35"};
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    onAuthStateChanged(auth, (user) => { if (!user) { window.location.href = "login.html"; } else { chargerCopies(); } });
    document.getElementById('logout').addEventListener('click', () => { signOut(auth).then(() => window.location.href = "login.html"); });
    window.showTab = (tab) => { document.getElementById('publier-form').style.display = tab === 'publier'? 'block' : 'none'; document.getElementById('copies-form').style.display = tab === 'copies'? 'block' : 'none'; }
    window.showSousTab = (tab) => { document.getElementById('cours-form').style.display = tab === 'cours'? 'block' : 'none'; document.getElementById('devoir-form').style.display = tab === 'devoir'? 'block' : 'none'; }
    function convertirLienDrive(lien) { if(lien && lien.includes("drive.google.com/file/d/")){ const fileId = lien.split("/d/")[1].split("/")[0]; return `https://drive.google.com/uc?export=download&id=${fileId}`; } return lien; }
    window.publier = async (type) => { /*... même code que avant... */ }
    async function chargerCopies() {
      const q = query(collection(db, "copies"), orderBy("dateDepot", "desc"));
      const snap = await getDocs(q);
      let html = snap.empty? "<p>Aucune copie rendue.</p>" : "";
      snap.forEach(doc => {
        const c = doc.data();
        html += `<div class="copie-card"><p><b>Devoir:</b> ${c.titreDevoir}</p><p><b>Étudiant:</b> ${c.emailEtudiant}</p><p><b>Date:</b> ${new Date(c.dateDepot.seconds * 1000).toLocaleDateString()}</p><a href="${c.lienCopie}" target="_blank">📥 Télécharger la copie</a></div>`;
      });
      document.getElementById('liste-copies').innerHTML = html;
    }
  </script>
</body>
</html>
