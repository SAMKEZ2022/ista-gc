<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ISTA-GC | Emploi du Temps</title>
  <style>
    *{box-sizing:border-box; margin:0; padding:0}
    body{font-family:'Segoe UI', Arial, sans-serif; background:#F0F4F8}
    
    header{
      background:#004AAD; color:white; padding:15px 30px; 
      display:flex; align-items:center; gap:15px;
      box-shadow:0 3px 10px rgba(0,74,173,0.3); position:sticky; top:0;
    }
    header img{height:55px; background:white; padding:5px; border-radius:10px}
    header h1{font-size:22px; margin:0; font-weight:700}

    .container{max-width:900px; margin:40px auto; padding:20px}
    h2{text-align:center; color:#004AAD; margin-bottom:30px; font-size:28px}

    .cours-card{
      background:white; padding:20px; margin:15px 0; border-radius:12px; 
      box-shadow:0 3px 12px rgba(0,74,173,0.1); 
      border-left:6px solid #004AAD;
      transition:transform 0.2s;
    }
    .cours-card:hover{transform:translateX(5px)}
    .cours-card b{font-size:20px; color:#004AAD}
    .cours-card p{margin:8px 0 0 0; color:#333; font-size:15px}
    .no-cours{text-align:center; padding:40px; color:#666; background:white; border-radius:12px}
  </style>
</head>
<body>
  <header>
    <img src="logo-ista.jpg" alt="Logo ISTA">
    <h1>ISTA-GC | Emploi du Temps</h1>
  </header>

  <div class="container">
    <h2>Liste des cours du jour</h2>
    <div id="listeCoursPublic">Chargement des cours...</div>
  </div>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
  import { getFirestore, collection, getDocs, orderBy, query } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

  const firebaseConfig = {
    apiKey: "AIzaSyCv3W6M3RmbipblwJ65Q0uw99a2H3tStU0",
    authDomain: "ista-gc.firebaseapp.com",
    projectId: "ista-gc",
    storageBucket: "ista-gc.firebasestorage.app",
    messagingSenderId: "75501350048",
    appId: "1:75501350048:web:8def71328c58dd6b7d6dc5",
    measurementId: "G-B2Y89V3X35"
  };
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  async function chargerCoursPublic(){
    const q = query(collection(db, "cours"), orderBy("createdAt", "desc"));
    const snap = await getDocs(q);
    let html = "";
    snap.forEach(docSnap => {
      const c = docSnap.data();
      const nomCours = c.nom || c.name || "Sans nom";
      html += `
        <div class="cours-card">
          <b>${nomCours}</b>
          <p><b>Salle:</b> ${c.salle || '-'} | <b>Heure:</b> ${c.heure || '-'}</p>
        </div>
      `;
    });
    document.getElementById('listeCoursPublic').innerHTML = html || '<div class="no-cours">Aucun cours programmé pour le moment</div>';
  }
  chargerCoursPublic();
</script>
</body>
</html>
