<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>ISTA-GC | Espace Étudiant</title>
  <style>
    body{margin:0; font-family:'Segoe UI', Arial; background:#F0F6FF} /* fond bleu très clair */
    
    /* HEADER BLEU */
    header{
      background:#003366; /* Bleu ISTA */
      color:white; 
      padding:15px 30px; 
      display:flex; 
      align-items:center;
      gap:15px;
      box-shadow:0 2px 5px rgba(0,0,0,0.2)
    }
    header img{height:45px; background:white; padding:3px; border-radius:4px}
    header h1{font-size:20px; margin:0}

    .box{max-width:500px; margin:50px auto; background:white; padding:30px; border-radius:8px; box-shadow:0 2px 15px rgba(0,51,102,0.2)}
    input{padding:12px; margin:8px 0; width:100%; box-sizing:border-box; border:1px solid #99BADD; border-radius:4px}
    input:focus{outline:none; border-color:#003366}
    
    /* BOUTON BLEU */
    button{
      padding:12px; 
      width:100%; 
      background:#003366; /* Bleu */
      color:white; 
      border:none; 
      cursor:pointer; 
      border-radius:4px; 
      font-size:16px;
      font-weight:bold
    }
    button:hover{background:#002244}

    #dashboard{display:none}
    h2{text-align:center; color:#003366}
  </style>
</head>
<body>
  <header>
    <img src="logo-ista.png" alt="Logo ISTA"> <!-- Mets ton logo ici -->
    <h1>ISTA-GC | Espace Étudiant</h1>
  </header>

  <div class="box">
    <h2>Connexion Étudiant</h2>
    <div id="login">
      <input id="email" type="email" placeholder="Email Étudiant">
      <input id="password" type="password" placeholder="Mot de passe">
      <button onclick="login()">Se connecter</button>
    </div>

    <div id="dashboard">
      <h2>Mes Cours</h2>
      <div id="listeCours">Chargement...</div>
      <button onclick="logout()" style="background:#555; margin-top:15px">Se déconnecter</button>
    </div>
  </div>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
  import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
  import { getFirestore, collection, getDocs } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

  const firebaseConfig = { /* TA CONFIG ICI */ };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  onAuthStateChanged(auth, user => {
    if(user){ document.getElementById('login').style.display='none'; document.getElementById('dashboard').style.display='block'; chargerCours(); }
  });

  window.login = () => signInWithEmailAndPassword(auth, email.value, password.value).catch(err => alert("Erreur: " + err.message))
  window.logout = () => signOut(auth).then(()=>location.reload())
  
  async function chargerCours(){
    const snap = await getDocs(collection(db, "cours"));
    let html = "";
    snap.forEach(doc => {
      const c = doc.data();
      html += `<p><b>${c.nom}</b> - ${c.salle} - ${c.heure}</p>`;
    });
    document.getElementById('listeCours').innerHTML = html || "Aucun cours";
  }
</script>
</body>
</html>
