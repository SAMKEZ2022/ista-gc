<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8"><title>Salle de cours</title>
<style>body{font-family:'Segoe UI'; text-align:center; padding:50px; background:#F0F4F8}
.box{background:white; padding:30px; border-radius:12px; max-width:500px; margin:auto}
input{padding:12px; width:90%; margin:10px 0; border:1px solid #ccc}
.btn{padding:14px; width:90%; background:#004AAD; color:white; border:none; border-radius:8px; font-size:16px; cursor:pointer}</style>
</head>
<body>
<div class="box">
  <h2 id="titre">Chargement...</h2>
  <div id="form">
    <p>Entre tes infos pour pointer</p>
    <input id="nom" placeholder="Nom complet">
    <input id="mat" placeholder="Matricule">
    <button class="btn" onclick="entrer()">Entrer en salle</button>
  </div>
  <div id="salle" style="display:none">
    <p>🟢 Tu es en cours</p>
    <p>Temps: <b id="timer">0</b> min</p>
    <a id="lienMeet" target="_blank" class="btn">REJOINDRE MEET/ZOOM</a>
  </div>
</div>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { getFirestore, doc, getDoc, setDoc, updateDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
const app = initializeApp({apiKey: "AIzaSyCv3W6M3RmbipblwJ65Q0uw99a2H3tStU0", authDomain: "ista-gc.firebaseapp.com", projectId: "ista-gc"});
const db = getFirestore(app);
const urlParams = new URLSearchParams(window.location.search);
const coursId = urlParams.get('id'); let etuId = null; let temps = 0; let interval;

async function init(){
  const c = await getDoc(doc(db,"cours",coursId));
  if(c.exists()){
    document.getElementById('titre').innerText = c.data().nom;
    document.getElementById('lienMeet').href = c.data().lien;
  } else {
    document.getElementById('titre').innerText = "Cours introuvable";
  }
}
init();

async function entrer(){
  etuId = document.getElementById('mat').value;
  await setDoc(doc(db,"cours",coursId,"etudiants",etuId),{nom:document.getElementById('nom').value,matricule:etuId,statut:"enLigne",debut:serverTimestamp()});
  document.getElementById('form').style.display="none"; 
  document.getElementById('salle').style.display="block";
  interval = setInterval(()=>{temps++; document.getElementById('timer').innerText=temps; updateDoc(doc(db,"cours",coursId,"etudiants",etuId),{temps:temps})},60000);
}
window.addEventListener('beforeunload', async ()=>{ if(etuId) await updateDoc(doc(db,"cours",coursId,"etudiants",etuId),{statut:"deconnecte"}) });
</script>
</body>
</html>
