<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Connexion ISTAGC</title>
  <style>
    body{font-family:Arial;background:linear-gradient(135deg,#007BFF,#00C853);display:flex;justify-content:center;align-items:center;height:100vh;margin:0}
    .box{background:white;padding:30px;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,0.2);width:350px}
    h2{text-align:center;color:#007BFF}
    input{width:100%;padding:12px;margin:10px 0;border:1px solid #ccc;border-radius:8px}
    button{width:100%;padding:12px;background:#007BFF;color:white;border:none;border-radius:8px;cursor:pointer;font-size:16px}
    button:hover{background:#0056b3}
    .error{color:red;text-align:center;margin-top:10px}
  </style>
</head>
<body>
  <div class="box">
    <h2>ISTAGC - Connexion</h2>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Mot de passe">
    <button onclick="login()">Se connecter</button>
    <p class="error" id="error"></p>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      // COLLE ICI TA CONFIG FIREBASE
      apiKey: "TA_CLE",
      authDomain: "TON_PROJET.firebaseapp.com",
      projectId: "TON_PROJET",
      storageBucket: "TON_PROJET.appspot.com",
      messagingSenderId: "XXX",
      appId: "XXX"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    async function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('error');
      errorEl.innerText = "";

      try {
        const userCredential = await signInWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;

        // On récupère le role dans Firestore
        const userDoc = await getDoc(doc(db, "users", user.uid));
        
        if (!userDoc.exists()) {
          errorEl.innerText = "Compte non trouvé dans la base. Contactez l'admin.";
          await auth.signOut();
          return;
        }

        const role = userDoc.data().role;

        // REDIRECTION SELON LE ROLE
        if (role === "prof") {
          window.location.href = "admin-panel.html";
        } else if (role === "etudiant") {
          window.location.href = "espace-etudiant.html";
        } else {
          errorEl.innerText = "Role non défini";
        }

      } catch (error) {
        errorEl.innerText = "Email ou mot de passe incorrect";
      }
    }
  </script>
</body>
</html>
