<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion Étudiant - ISTA-GC</title>
<style>
body{font-family:Arial; background:#f0f2f5; display:flex; justify-content:center; align-items:center; height:100vh; margin:0;}
.login-box{background:white; padding:30px; border-radius:10px; box-shadow:0 4px 10px rgba(0,0,0,0.1); width:350px;}
h2{text-align:center; color:#0056b3;}
input{width:100%; padding:12px; margin:10px 0; border:1px solid #ddd; border-radius:5px; box-sizing:border-box;}
button{width:100%; padding:12px; background:#0056b3; color:white; border:none; border-radius:5px; cursor:pointer; font-size:16px;}
button:hover{background:#003d82;}
.error{color:red; text-align:center; margin-top:10px;}
</style>
</head>
<body>
<div class="login-box">
  <h2>ISTA-GC Étudiant</h2>
  <input type="email" id="email" placeholder="Email étudiant">
  <input type="password" id="password" placeholder="Mot de passe">
  <button onclick="login()">Se connecter</button>
  <p class="error" id="error"></p>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { getAuth, signInWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

const firebaseConfig = {
  apiKey: "COLLE_TA_NOUVELLE_CLE_ICI",
  authDomain: "ista-gc.firebaseapp.com",
  projectId: "ista-gc"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

window.login = () => {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  signInWithEmailAndPassword(auth, email, password)
   .then(() => { window.location.href = "index.html"; })
   .catch((error) => { document.getElementById('error').innerText = "Email ou mot de passe incorrect"; });
}
</script>
</body>
</html>
