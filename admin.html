<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Admin - ISTA GC</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // TA VRAIE CONFIG
    const firebaseConfig = {
      apiKey: "AIzaSyCv3W6M3RmbipblwJ65Q0uw99a2H3tStU0",
      authDomain: "ista-gc.firebaseapp.com",
      projectId: "ista-gc",
      storageBucket: "ista-gc.firebasestorage.app",
      messagingSenderId: "75501350048",
      appId: "1:75501350048:web:8def71328c58dd6b7d6dc5",
      measurementId: "G-B2Y89V3X35"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const notesRef = collection(db, "notes");

    onAuthStateChanged(auth, user => {
      if(user && user.email === "prof@ista.gc"){
        document.getElementById("login").classList.add("hidden");
        document.getElementById("admin").classList.remove("hidden");
      } else {
        document.getElementById("login").classList.remove("hidden");
        document.getElementById("admin").classList.add("hidden");
      }
    });

    window.login = () => {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      signInWithEmailAndPassword(auth, email, password).catch(e => alert("Erreur: " + e.message));
    }

    window.logout = () => signOut(auth);

    window.ajouterNote = async () => {
      const email = document.getElementById("etudiantEmail").value;
      const cours = document.getElementById("cours").value;
      const note = document.getElementById("note").value;
      const semestre = document.getElementById("semestre").value;
      
      await addDoc(notesRef, {
        email: email,
        cours: cours,
        note: parseFloat(note),
        semestre: semestre,
        date: serverTimestamp()
      });
      alert("Note ajoutée !");
      document.getElementById("form").reset();
    }
  </script>
</head>
<body class="bg-gray-100 p-10">
  <div id="login" class="max-w-md mx-auto bg-white p-8 rounded shadow">
    <h1 class="text-2xl font-bold mb-4">Connexion Prof</h1>
    <input id="email" type="email" placeholder="prof@ista.gc" class="w-full p-2 border mb-2">
    <input id="password" type="password" placeholder="Mot de passe" class="w-full p-2 border mb-4">
    <button onclick="login()" class="w-full bg-blue-600 text-white p-2 rounded">Se connecter</button>
  </div>

  <div id="admin" class="hidden max-w-2xl mx-auto bg-white p-8 rounded shadow">
    <div class="flex justify-between mb-4">
      <h1 class="text-2xl font-bold">Ajouter une Note</h1>
      <button onclick="logout()" class="bg-red-500 text-white px-4 py-2 rounded">Déconnexion</button>
    </div>
    <form id="form" onsubmit="event.preventDefault(); ajouterNote();">
      <input id="etudiantEmail" type="email" placeholder="Email étudiant" class="w-full p-2 border mb-2" required>
      <input id="cours" type="text" placeholder="Nom du cours: RDM, Béton..." class="w-full p-2 border mb-2" required>
      <input id="note" type="number" step="0.01" placeholder="Note /20" class="w-full p-2 border mb-2" required>
      <select id="semestre" class="w-full p-2 border mb-4" required>
        <option value="">Choisir Semestre</option>
        <option value="S1">Semestre 1</option>
        <option value="S2">Semestre 2</option>
      </select>
      <button type="submit" class="w-full bg-green-600 text-white p-2 rounded">Enregistrer la note</button>
    </form>
  </div>
</body>
</html>
