<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8"><title>Admin ISTA-GC</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><h1>👑 Espace Admin</h1><button onclick="logout()" class="btn-logout">Déconnexion</button></header>
<main>
    <section class="stats"><h3>Statistiques</h3><p>Cours: <span id="totalCours">0</span> | Devoirs: <span id="totalDevoirs">0</span> | Profs: <span id="totalProfs">0</span> | Etudiants: <span id="totalEtudiants">0</span></p></section>
    <section><h2>👤 Gérer Utilisateurs</h2><form id="formAddUser" class="card"><input type="email" id="newEmail" placeholder="Email" required><input type="password" id="newPassword" placeholder="Mot de passe" required><select id="newRole"><option value="etudiant">Etudiant</option><option value="prof">Prof</option></select><button type="submit" class="btn-primary">Ajouter</button></form><div id="listeUsers"></div></section>
    <section><h2>📚 Gérer Cours</h2><form id="formAddCours" class="card"><input type="text" id="newTitre" placeholder="Titre du cours" required><input type="datetime-local" id="newDate" required><input type="url" id="newLien" placeholder="Lien Google Meet" required><button type="submit" class="btn-primary">Programmer</button></form><div id="listeCoursAdmin"></div></section>
    <section><h2>📝 Gérer Devoirs</h2><form id="formAddDevoir" class="card"><input type="text" id="newTitreDevoir" placeholder="Titre du devoir" required><textarea id="newDescDevoir" placeholder="Description" required></textarea><button type="submit" class="btn-primary">Créer Devoir</button></form><div id="listeDevoirsAdmin"></div></section>
</main>
<script src="script.js"></script></body></html>
