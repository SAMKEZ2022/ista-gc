<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espace Admin - ISTA-GC</title><link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header><h1>👑 Espace Administrateur</h1><button class="btn-danger" onclick="logout()">Déconnexion</button></header>
        
        <section><h2>📊 Tableau de Bord</h2>
            <div class="card stats">
                <p><b>Total Cours:</b> <span id="totalCours">0</span></p>
                <p><b>Total Devoirs:</b> <span id="totalDevoirs">0</span></p>
                <p><b>Total Profs:</b> <span id="totalProfs">0</span></p>
                <p><b>Total Étudiants:</b> <span id="totalEtudiants">0</span></p>
            </div>
        </section>

        <section><h2>👥 Gestion des Utilisateurs</h2>
            <form id="formAddUser" class="card">
                <h4>Ajouter un utilisateur</h4>
                <input type="email" id="newEmail" placeholder="Email" required>
                <input type="text" id="newPassword" placeholder="Mot de passe" required>
                <select id="newRole" required><option value="">Choisir le rôle</option><option value="prof">Professeur</option><option value="etudiant">Étudiant</option></select>
                <button type="submit" class="btn-primary">Ajouter</button>
            </form>
            <div id="listeUsers" class="liste"></div>
        </section>

        <section><h2>📢 Gestion des Cours</h2>
            <form id="formAddCours" class="card">
                <h4>Ajouter un cours</h4>
                <input type="text" id="newTitre" placeholder="Titre du cours" required>
                <input type="text" id="newDate" placeholder="Ex: Lundi 25 Août - De 8:00 à 10:00" required>
                <input type="url" id="newLien" placeholder="Lien Google Meet https://..." required>
                <button type="submit" class="btn-primary">Ajouter le cours</button>
            </form>
            <div id="listeCoursAdmin" class="liste"></div>
        </section>

        <section><h2>📝 Gestion des Devoirs</h2>
            <form id="formAddDevoir" class="card">
                <h4>Ajouter un devoir</h4>
                <input type="text" id="newTitreDevoir" placeholder="Titre du devoir" required>
                <input type="text" id="newDescDevoir" placeholder="Date de rendu + Consignes" required>
                <button type="submit" class="btn-primary">Ajouter le devoir</button>
            </form>
            <div id="listeDevoirsAdmin" class="liste"></div>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
