<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - ISTA-GC</title>
    <link rel="stylesheet" href="./style.css">
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
    <script src="./firebase-config.js"></script>
    <style>.login-container { max-width:400px; margin:100px auto; padding:30px; border:1px solid #ddd; border-radius:10px; text-align:center; } .hidden { display: none!important; }</style>
</head>
<body>
    <div id="loginScreen" class="login-container">
        <h2>👑 Connexion Admin ISTA-GC</h2>
        <input type="email" id="email" placeholder="Email" required style="width:100%; padding:10px; margin:10px 0;">
        <input type="password" id="password" placeholder="Mot de passe" required style="width:100%; padding:10px; margin:10px 0;">
        <button onclick="login()" style="width:100%; padding:10px; background:#004a99; color:white; border:none;">Se connecter</button>
        <p id="loginError" style="color:red;"></p>
    </div>

    <div id="adminPanel" class="hidden">
        <header class="header">
            <div class="header-brand">
                <img src="./logo.png" alt="Logo ISTR" class="logo-header">
                <h1>👑 Panneau Admin</h1>
            </div>
            <button class="btn-logout" onclick="logout()">Déconnexion</button>
        </header>
        <div class="container">
            <h3>📊 Statistiques</h3>
            <div class="stats-grid">
                <div class="stat-box"><div class="stat-value" id="totalCours">0</div><div class="stat-label">Cours</div></div>
                <div class="stat-box"><div class="stat-value" id="totalDevoirs">0</div><div class="stat-label">Devoirs</div></div>
                <div class="stat-box"><div class="stat-value" id="totalProfs">0</div><div class="stat-label">Professeurs</div></div>
                <div class="stat-box"><div class="stat-value" id="totalEtudiants">0</div><div class="stat-label">Étudiants</div></div>
            </div>
            <div id="listeUsers"></div>
        </div>
    </div>

<script>
    const auth = firebase.auth();
    const db = firebase.firestore();

    auth.onAuthStateChanged(async (user) => {
        if (user) {
            const roleDoc = await db.collection('roles').doc(user.uid).get();
            if(roleDoc.exists && roleDoc.data().role === 'admin'){ showAdminPanel(); loadStats(); } 
            else { showLoginScreen(); auth.signOut(); }
        } else { showLoginScreen(); }
    });

    async function login() {
        const email = document.getElementById('email').value;
        const pass = document.getElementById('password').value;
        try {
            const userCredential = await auth.signInWithEmailAndPassword(email, pass);
            const roleDoc = await db.collection('roles').doc(userCredential.user.uid).get();
            if(roleDoc.exists && roleDoc.data().role === 'admin'){ showAdminPanel(); loadStats(); } 
            else { document.getElementById('loginError').innerText = "Accès refusé"; auth.signOut(); }
        } catch(error) { document.getElementById('loginError').innerText = error.message; }
    }

    function logout() { auth.signOut(); }
    function showAdminPanel(){ document.getElementById('loginScreen').classList.add('hidden'); document.getElementById('adminPanel').classList.remove('hidden'); }
    function showLoginScreen(){ document.getElementById('loginScreen').classList.remove('hidden'); document.getElementById('adminPanel').classList.add('hidden'); }
    
    async function loadStats(){
        const usersSnap = await db.collection('users').get();
        let profs=0, etudiants=0;
        usersSnap.forEach(doc => { if(doc.data().role === 'prof') profs++; if(doc.data().role === 'etudiant') etudiants++; });
        document.getElementById('totalProfs').innerText = profs;
        document.getElementById('totalEtudiants').innerText = etudiants;
    }
</script>
</body>
</html>
