<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8"><title>Espace Prof</title>
<style>
body{margin:0;font-family:Arial;background:#fff5f5} 
header{background:linear-gradient(135deg,#DC3545,#FF6B00);color:white;padding:20px;text-align:center}
.container{max-width:900px;margin:20px auto;background:white;padding:30px;border-radius:12px}
input,textarea,select{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:8px}
.btn{background:#DC3545;color:white;padding:12px;border:none;border-radius:8px;cursor:pointer}
.card{border-left:4px solid #DC3545;background:#fff0f0;padding:15px;margin:10px 0;border-radius:8px}
</style></head>
<body>
<header><h1>ISTAGC - Espace Professeur</h1></header>
<div class="container">
  <h2 id="welcome"></h2><button onclick="logout()" style="float:right">Déconnexion</button>
  
  <h3>Déposer un Cours</h3>
  <input id="titreCours" placeholder="Titre du cours: Ex: Agroécologie S1">
  <textarea id="descCours" placeholder="Description du cours"></textarea>
  <input type="file" id="fichierCours">
  <button class="btn" onclick="ajouterCours()">Publier le Cours</button>

  <h3>Déposer un Devoir</h3>
  <input id="titreDevoir" placeholder="Titre du devoir">
  <input type="date" id="dateLimite">
  <button class="btn" onclick="ajouterDevoir()">Publier le Devoir</button>

  <h3>Mes Cours Publiés</h3>
  <div id="listeCours">Chargement...</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {apiKey: "AIzaSyCv3W6M3RmbipblwJ65Q0uw99a2H3tStU0",authDomain: "ista-gc.firebaseapp.com",projectId: "ista-gc",storageBucket: "ista-gc.firebasestorage.app",messagingSenderId: "75501350048",appId: "1:75501350048:web:8def71328c58dd6b7d6dc5"};
const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app);
let profEmail = "";

onAuthStateChanged(auth, (user) => {
  if(user){ profEmail = user.email; document.getElementById('welcome').innerText = `Bienvenue Prof ${user.email}`; chargerCours(); }
  else{ window.location.href = "login-prof.html"; }
});

async function ajouterCours(){
  await addDoc(collection(db,"cours"),{titre:document.getElementById('titreCours').value,description:document.getElementById('descCours').value,prof:profEmail,date:new Date()});
  alert("Cours publié !"); chargerCours();
}
async function ajouterDevoir(){
  await addDoc(collection(db,"devoirs"),{titre:document.getElementById('titreDevoir').value,dateLimite:document.getElementById('dateLimite').value,prof:profEmail});
  alert("Devoir publié !");
}
async function chargerCours(){
  const snap = await getDocs(query(collection(db,"cours"), where("prof","==",profEmail)));
  let html=""; snap.forEach(d=>{const data=d.data(); html+=`<div class="card"><b>${data.titre}</b><br>${data.description}</div>`});
  document.getElementById('listeCours').innerHTML = html || "Aucun cours";
}
function logout(){signOut(auth)} window.logout=logout; window.ajouterCours=ajouterCours; window.ajouterDevoir=ajouterDevoir;
</script>
</body></html>
<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Admin ISTAGC</title>
<style>body{margin:0;background:#1a1a1a;color:white;font-family:Arial} header{background:black;padding:20px;text-align:center} .container{max-width:800px;margin:20px auto;background:#2a2a2a;padding:30px;border-radius:12px} input,select{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:none}</style></head>
<body>
<header><h1>ISTAGC - Espace Administrateur</h1></header>
<div class="container">
  <h2>Créer un Compte</h2>
  <input id="email" placeholder="Email">
  <input id="password" placeholder="Mot de passe" type="password">
  <select id="role"><option value="etudiant">Etudiant</option><option value="prof">Professeur</option></select>
  <button onclick="creerCompte()">Créer le Compte</button>
  <p id="msg"></p>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {apiKey: "AIzaSyCv3W6M3RmbipblwJ65Q0uw99a2H3tStU0",authDomain: "ista-gc.firebaseapp.com",projectId: "ista-gc",storageBucket: "ista-gc.firebasestorage.app",messagingSenderId: "75501350048",appId: "1:75501350048:web:8def71328c58dd6b7d6dc5"};
const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app);
async function creerCompte(){
  const email=document.getElementById('email').value; const password=document.getElementById('password').value; const role=document.getElementById('role').value;
  const userCred = await createUserWithEmailAndPassword(auth,email,password);
  await setDoc(doc(db,"users",userCred.user.uid),{email:email,role:role});
  document.getElementById('msg').innerText = "Compte créé !";
}
window.creerCompte=creerCompte;
</script>
</body></html>
