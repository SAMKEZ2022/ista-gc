<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espace Admin - ISTA-GC</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>👑 Espace Administrateur</h1>
            <button class="btn-danger" onclick="logout()">Déconnexion</button>
        </header>
        
        <section>
            <h2>📊 Tableau de Bord</h2>
            <div class="card">
                <p><b>Total Cours:</b> <span id="totalCours">0</span></p>
                <p><b>Total Devoirs:</b> <span id="totalDevoirs">0</span></p>
            </div>
        </section>

        <section>
            <h2>📢 Tous les Cours</h2>
            <div id="listeCoursAdmin" class="liste"></div>
        </section>
    </div>
    <script src="script.js"></script>
    <script>
    // Compteur pour Admin
    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('totalCours').innerText = COURS.length;
        document.getElementById('totalDevoirs').innerText = DEVOIRS.length;
        document.getElementById('listeCoursAdmin').innerHTML = COURS.map(c => `
            <div class="card"><h4>${c.titre}</h4><p>${c.date}</p></div>
        `).join('');
    });
    </script>
</body>
</html>
