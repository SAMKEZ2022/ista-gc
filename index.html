<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { getAuth, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
import { getFirestore, collection, onSnapshot, query, orderBy, limit } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyCv3W6M3RmbipblwJ65Q0uw99a2H3tStU0",
  authDomain: "ista-gc.firebaseapp.com",
  projectId: "ista-gc"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const appDiv = document.getElementById('app');

// 1. VÉRIFIER SI CONNECTÉ
onAuthStateChanged(auth, user => {
  if (user) {
    appDiv.style.display = 'block';
    chargerCours();
    chargerEtudiants();
  } else {
    window.location.href = "login-etudiant.html";
  }
});

// 2. DÉCONNEXION
document.getElementById('btnLogout').onclick = () => {
  signOut(auth).then(() => {
    window.location.href = "login-etudiant.html";
  });
}

// 3. CHARGER COURS
function chargerCours() {
  const coursRef = collection(db, "cours_actifs"); // <-- NOM IMPORTANT
  const q = query(coursRef, orderBy("created", "desc"), limit(1));
  
  onSnapshot(q, (snapshot) => {
    const container = document.getElementById('cours-container');
    if (snapshot.empty) {
      container.innerHTML = '<p style="text-align:center; color:#666; padding:40px;">Aucun cours en direct pour le moment.</p>';
      return;
    }
    
    const cours = snapshot.docs[0].data();
    container.innerHTML = `
      <div class="cours-actif">
        <h2>📢 Cours en Direct</h2>
        <p><b>Matière:</b> ${cours.nom}</p>
        <p><b>Prof:</b> ${cours.profEmail}</p>
        <a href="${cours.lien}" target="_blank" class="btn-rejoindre">Rejoindre le Meet</a>
      </div>
    `;
  }, (error) => {
    console.error("Erreur Firestore:", error);
    document.getElementById('cours-container').innerHTML = '<p style="color:red">Erreur: Vérifiez les règles Firebase</p>';
  });
}

// 4. CHARGER ÉTUDIANTS
function chargerEtudiants() {
  const etuRef = collection(db, "etudiants");
  onSnapshot(etuRef, (snapshot) => {
    const liste = document.getElementById('liste-etudiants');
    liste.innerHTML = '';
    snapshot.forEach(doc => {
      const etu = doc.data();
      liste.innerHTML += `<div class="etudiant">${etu.nom || ''} ${etu.prenom || ''}</div>`;
    });
  });
}
</script>
