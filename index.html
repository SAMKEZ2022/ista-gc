<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Espace Étudiant - ISTA-GC</title>
    <style>
        body{font-family:Arial;margin:0;padding:20px;background:#f0f2f5}
       .header{background:#0056b3;color:white;padding:15px;border-radius:5px;display:flex;justify-content:space-between}
       .card{background:white;padding:20px;margin-top:20px;border-radius:5px}
        input[type="file"]{margin:10px 0}
        button{background:#0056b3;color:white;padding:10px 20px;border:none;border-radius:5px;cursor:pointer}
    </style>
</head>
<body>
    <div class="header">
        <h3>Bienvenue Étudiant</h3>
        <button onclick="logout()">Déconnexion</button>
    </div>
    <div class="card">
        <h4>Cours: Béton Armé BA1</h4>
        <p><a href="#">Télécharger le cours PDF</a></p>
        <h4>Déposer un devoir</h4>
        <input type="file" id="devoir">
        <button onclick="uploadDevoir()">Envoyer</button>
        <p id="msg"></p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getStorage, ref, uploadBytes } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        const firebaseConfig = {apiKey: "METS_TA_VRAIE_CLE_ICI", authDomain: "ista-gc.firebaseapp.com", projectId: "ista-gc", storageBucket: "ista-gc.appspot.com", appId: "1:XXXX:web:XXXX"};
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const storage = getStorage(app);

        onAuthStateChanged(auth, (user) => { if (!user) window.location.href = 'login-etudiant.html'; });
        window.logout = () => signOut(auth).then(() => window.location.href = 'login-etudiant.html');

        window.uploadDevoir = function() {
            const file = document.getElementById('devoir').files[0];
            const user = auth.currentUser;
            if(file && user){
                const storageRef = ref(storage, `devoirs/${user.uid}/${file.name}`);
                uploadBytes(storageRef, file).then(() => {document.getElementById('msg').innerText = "Devoir envoyé avec succès!";});
            }
        }
    </script>
</body>
</html>
