<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ISTA-GC - Accueil Étudiants</title>
<style>
  body { font-family: 'Segoe UI', sans-serif; background: #F0F4F8; margin: 0; padding: 20px; }
  .container { max-width: 600px; margin: auto; }
  h1 { color: #004AAD; text-align: center; }
  .card { background: white; padding: 15px; border-radius: 12px; margin: 15px 0; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
  .cours { background: #E6F4EA; border-left: 5px solid #28a745; }
  .btn { display: block; width: 100%; padding: 12px; background: #004AAD; color: white; text-align: center; text-decoration: none; border-radius: 8px; margin-top: 10px; font-weight: bold; }
  .btn:hover { opacity: 0.9; }
</style>
</head>
<body>
<div class="container">
  <h1>ISTA-GC Génie Civil</h1>

  <div class="card cours">
    <h3>📢 Cours en Direct</h3>
    <div id="listeCours">Chargement...</div>
  </div>

  <div class="card">
    <h3>👥 Étudiants Connectés</h3>
    <div id="listeEtudiants">Chargement...</div>
  </div>

</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { getFirestore, collection, onSnapshot, query, orderBy } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

const app = initializeApp({
  apiKey: "AIzaSyCv3W6M3RmbipblwJ65Q0uw99a2H3tStU0", 
  authDomain: "ista-gc.firebaseapp.com", 
  projectId: "ista-gc"
});
const db = getFirestore(app);

// 1. AFFICHER LES COURS EN DIRECT
const qCours = query(collection(db, "cours"), orderBy("created", "desc"));
onSnapshot(qCours, (snapshot) => {
  const listeCours = document.getElementById('listeCours');
  listeCours.innerHTML = '';
  if(snapshot.empty){ 
    listeCours.innerHTML = "<p>Aucun cours en cours pour le moment</p>" 
  } else {
    snapshot.forEach(doc => {
      const c = doc.data();
      listeCours.innerHTML += `
        <div style="background:white; padding:12px; margin:10px 0; border-radius:8px">
          <b style="font-size:18px">${c.nom}</b><br>
          <small>Par: ${c.profEmail}</small><br>
          <a href="${c.lien}" target="_blank" class="btn">Rejoindre le Meet</a>
        </div>
      `;
    })
  }
})

// 2. AFFICHER LA LISTE DES ÉTUDIANTS
onSnapshot(collection(db, "etudiants"), (snapshot) => {
  const listeEtudiants = document.getElementById('listeEtudiants');
  listeEtudiants.innerHTML = '';
  snapshot.forEach(doc => {
    const e = doc.data();
    listeEtudiants.innerHTML += `<p>• ${e.nom} ${e.prenom}</p>`;
  })
})
</script>
</body>
</html>
